<!-- REGISTER BUTTON -->
<button class="register-btn" onclick="openRegistration()">
  Register Now
</button>

<!-- REGISTRATION POPUP -->
<div id="registrationModal" class="modal">

  <div class="modal-content">

    <span class="close-btn" onclick="closeRegistration()">&times;</span>

    <h2>VLSTech Registration</h2>

    <p>
      Fill in your details below to register for our technology training programs.
    </p>

    <form onsubmit="submitRegistration(event)">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >

      <label for="course">Select Training Program</label>
      <select id="course" name="course" required>
        <option value="">-- Select a course --</option>
        <option value="CCNA">CCNA</option>
        <option value="MikroTik">MikroTik</option>
        <option value="Cybersecurity">Cybersecurity</option>
        <option value="Networking">Networking</option>
        <option value="Web Development">Web Development</option>
      </select>

      <label for="message">Additional Information</label>
      <textarea
        id="message"
        name="message"
        placeholder="Tell us anything else..."
        rows="4"
      ></textarea>

      <button type="submit" class="submit-btn">
        Submit Registration
      </button>

    </form>

  </div>
</div>

<style>
/* REGISTER BUTTON */
.register-btn {
  background: #00c853;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.register-btn:hover {
  background: #00a844;
}

/* POPUP BACKGROUND */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  overflow-y: auto;
  padding: 30px 15px;
}

/* POPUP BOX */
.modal-content {
  background: #ffffff;
  color: #222;
  max-width: 500px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 15px;
  position: relative;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

/* CLOSE BUTTON */
.close-btn {
  position: absolute;
  right: 20px;
  top: 10px;
  font-size: 32px;
  font-weight: bold;
  color: #555;
  cursor: pointer;
}

.close-btn:hover {
  color: red;
}

.modal-content h2 {
  margin-bottom: 10px;
  color: #0066cc;
}

.modal-content p {
  margin-bottom: 20px;
  color: #555;
}

/* FORM */
.modal-content label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

.modal-content textarea {
  resize: vertical;
}

/* SUBMIT BUTTON */
.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #0066cc;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn:hover {
  background: #004c99;
}

/* MOBILE */
@media (max-width: 600px) {
  .modal-content {
    margin: 10px auto;
    padding: 25px 20px;
  }
}
</style>

<script>
/* OPEN REGISTRATION */
function openRegistration() {
  document.getElementById("registrationModal").style.display = "block";
}

/* CLOSE REGISTRATION */
function closeRegistration() {
  document.getElementById("registrationModal").style.display = "none";
}

/* SUBMIT REGISTRATION */
function submitRegistration(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const course = document.getElementById("course").value;

  alert(
    "Registration successful!\n\n" +
    "Name: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Email: " + email + "\n" +
    "Course: " + course
  );

  document.querySelector("form").reset();
  closeRegistration();
}

/* CLOSE WHEN CLICKING OUTSIDE THE FORM */
window.onclick = function(event) {
  const modal = document.getElementById("registrationModal");

  if (event.target === modal) {
    closeRegistration();
  }
};
</script>
