<!-- REGISTER BUTTON -->
<button class="register-btn" onclick="openRegistration()">
  Register Now
</button>


<!-- REGISTRATION POPUP -->
<div id="registrationModal" class="modal">

  <div class="modal-content">

    <span class="close-btn" onclick="closeRegistration()">&times;</span>

    <h2>VLSTech Registration</h2>

    <p>
      Fill in your details below to register for our technology training programs.
    </p>

    <form onsubmit="submitRegistration(event)">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >

      <label for="course">Select Course</label>
      <select id="course" name="course" required>
        <option value="">-- Select a course --</option>
        <option value="CCNA">CCNA</option>
        <option value="MikroTik">MikroTik</option>
        <option value="Cyber Security">Cyber Security</option>
        <option value="Networking">Networking</option>
        <option value="CCTV Installation">CCTV Installation</option>
        <option value="Computer Training">Computer Training</option>
      </select>

      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        placeholder="Any additional information..."
      ></textarea>

      <button type="submit" class="submit-btn">
        Submit Registration
      </button>

    </form>

  </div>
</div>


<style>

/* REGISTER BUTTON */
.register-btn {
  background: #00c853;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.register-btn:hover {
  background: #00a844;
}


/* POPUP BACKGROUND */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  overflow-y: auto;
  padding: 30px 15px;
}


/* POPUP BOX */
.modal-content {
  position: relative;
  background: #075985;
  max-width: 600px;
  margin: 20px auto;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  color: white;
}


/* CLOSE BUTTON */
.close-btn {
  position: absolute;
  right: 20px;
  top: 10px;
  font-size: 35px;
  cursor: pointer;
  color: white;
}

.close-btn:hover {
  color: #ff5252;
}


.modal-content h2 {
  font-size: 32px;
  margin-bottom: 10px;
  text-align: center;
}

.modal-content p {
  text-align: center;
  line-height: 1.6;
  margin-bottom: 25px;
}


/* FORM */
.modal-content label {
  display: block;
  font-size: 17px;
  font-weight: bold;
  margin: 15px 0 8px;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  background: #f5f8fa;
  color: #222;
}

.modal-content textarea {
  min-height: 120px;
  resize: vertical;
}


/* SUBMIT BUTTON */
.submit-btn {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #25D366;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn:hover {
  background: #1ebe5d;
}


/* MOBILE */
@media (max-width: 600px) {

  .modal {
    padding: 15px;
  }

  .modal-content {
    padding: 25px 20px;
    margin: 10px auto;
  }

  .modal-content h2 {
    font-size: 27px;
  }

}

</style>


<script>

function openRegistration() {
  document.getElementById("registrationModal").style.display = "block";
}

function closeRegistration() {
  document.getElementById("registrationModal").style.display = "none";
}


/* CLOSE WHEN CLICKING OUTSIDE THE FORM */
window.onclick = function(event) {

  const modal = document.getElementById("registrationModal");

  if (event.target === modal) {
    closeRegistration();
  }

}


/* FORM SUBMISSION */
function submitRegistration(event) {

  event.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const course = document.getElementById("course").value;
  const message = document.getElementById("message").value;

  alert(
    "Registration received!\n\n" +
    "Name: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Email: " + email + "\n" +
    "Course: " + course
  );

  closeRegistration();

}

</script>
