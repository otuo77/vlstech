<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VLSTech - Technology Training</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: linear-gradient(135deg, #001f3f, #0074D9, #00b894);
      color: white;
    }

    header {
      background: rgba(0, 0, 0, 0.75);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 38px;
      color: #00ffcc;
    }

    header p {
      font-size: 18px;
      margin-top: 5px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    nav a:hover {
      color: #00ffcc;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      max-width: 700px;
      margin: auto;
    }

    .register-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #00c853;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .register-btn:hover {
      background: #009624;
    }

    section {
      padding: 50px 20px;
      text-align: center;
    }

    section h2 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #00ffcc;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .course {
      background: rgba(255, 255, 255, 0.12);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .course h3 {
      color: #00ffcc;
      margin-bottom: 10px;
      font-size: 23px;
    }

    .course p {
      color: white;
    }

    .about {
      max-width: 850px;
      margin: auto;
      font-size: 18px;
    }

    .contact {
      background: rgba(0, 0, 0, 0.4);
      padding: 40px 20px;
    }

    .contact p {
      margin: 10px 0;
      font-size: 18px;
    }

    footer {
      background: #00111f;
      text-align: center;
      padding: 20px;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      color: #222;
      width: 90%;
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      position: relative;
    }

    .modal-content h2 {
      text-align: center;
      color: #0074D9;
      margin-bottom: 20px;
    }

    .close-btn {
      position: absolute;
      right: 18px;
      top: 10px;
      font-size: 30px;
      color: red;
      cursor: pointer;
    }

    form label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    form input,
    form select,
    form textarea {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    form textarea {
      height: 80px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #128C7E;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      .hero h2 {
        font-size: 32px;
      }
