<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VLSTech - AI Automation & Technology Training</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f4f7fb;
      color: #222;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #061a40, #0077b6, #00b4d8);
      color: white;
      padding: 15px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd60a;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd60a;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 40px 20px;

      background:
        linear-gradient(
          rgba(3, 20, 50, 0.8),
          rgba(0, 119, 182, 0.75)
        ),
        linear-gradient(135deg, #03045e, #0077b6, #00b4d8);
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #ffd60a;
    }

    .hero p {
      font-size: 21px;
      margin-bottom: 30px;
    }

    .register-btn {
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      background: #ffd60a;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-btn:hover {
      background: white;
      transform: scale(1.05);
    }

    /* SECTIONS */
    section {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      font-size: 35px;
      color: #023e8a;
    }

    .section-title p {
      color: #666;
      margin-top: 10px;
    }

    /* COURSES */
    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .course {
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .course:hover {
      transform: translateY(-8px);
    }

    .course-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .course h3 {
      color: #0077b6;
      margin-bottom: 12px;
    }

    .course p {
      color: #555;
    }

    /* AI AUTOMATION */
    .automation {
      background: linear-gradient(135deg, #023e8a, #0077b6);
      color: white;
    }

    .automation .section-title h2 {
      color: white;
    }

    .automation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .automation-card {
      background: rgba(255,255,255,0.12);
      padding: 30px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .automation-card h3 {
      color: #ffd60a;
      margin-bottom: 10px;
    }

    /* ABOUT */
    .about {
      background: white;
    }

    .about-content {
      max-width: 900px;
      margin: auto;
      text-align: center;
      font-size: 18px;
    }

    /* CONTACT */
    .contact {
      background: #eef6ff;
    }

    .contact-box {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .contact-box p {
      margin: 12px 0;
      font-size: 18px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 18px;
      position: relative;
      animation: popup 0.3s ease;
    }

    @keyframes popup {
      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
